# Configuração do comando `ia`.
# Variáveis de ambiente (IA_MODELO, IA_EXECUTAVEL, IA_PORTA, IA_GPU, IA_CONTEXTO)
# têm prioridade sobre este arquivo. Depois de mudar algo, rode: ia --parar

[ia]
# Modelo: um .llamafile (roda sozinho) ou um .gguf (roda pelo 'executavel' abaixo).
modelo = ~/.local/share/ia/modelos/Qwen3.5-2B-Q8_0.llamafile

# Só para modelos .gguf: o llamafile que vai rodá-los (qualquer .llamafile serve).
# Se você compilou o ggml-cuda.so, ele precisa ficar na mesma pasta deste arquivo.
executavel = ~/.local/share/ia/modelos/llamafile

# Porta local do servidor (só escuta em 127.0.0.1).
porta = 8085

# nvidia = usa a GPU | disable = só CPU
gpu = nvidia

# Tamanho do contexto em tokens (pergunta + arquivo + resposta).
contexto = 16384

# 0 = respostas mais previsíveis, 1 = mais criativas.
temperatura = 0.3

# Instrução de sistema enviada nas perguntas livres (os atalhos têm a sua).
sistema = Você é um assistente de terminal. Responda em português do Brasil,
    de forma direta e curta, sem rodeios. Se a pergunta for simples, responda
    só o resultado. Quando receber um conteúdo, use-o para responder.

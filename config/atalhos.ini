# Atalhos personalizados do `ia`.
#
# Os atalhos de fábrica (commit, log, cmd, explica, erro, resumo, traduz, corrige)
# ficam dentro do próprio ~/.local/bin/ia. Veja todos com: ia atalhos
# Uma seção aqui com o mesmo nome sobrescreve só as chaves que você definir.
# Uma seção com nome novo cria um atalho novo.
#
# Chaves:
#   descricao        texto mostrado em `ia atalhos`
#   sistema          instrução de como o modelo deve responder
#   pedido           frase colocada antes do conteúdo
#   entrada          texto       -> argumentos ou o que vier por pipe
#                    comando     -> roda `comando` no bash e usa a saída
#                                   (argumentos do atalho chegam em $1, $2, $@)
#                    ultimo_erro -> último comando que falhou (gancho do bash)
#   comando          comando bash usado quando entrada = comando
#   verificar        comando bash; se falhar, o atalho para e mostra `verificar_erro`
#   verificar_vazio  mensagem mostrada quando a entrada vem vazia
#   pensar           sim/nao: liga o raciocínio (mais lento, acerta mais)
#   acao             nenhuma | executar (confirma e roda) | commit (confirma e commita)
#   cortar           inicio/fim: que parte manter se o conteúdo for grande demais
#
# Linhas que começam com espaço continuam o valor da linha anterior.

# Exemplo: gerar SQL.
#
# [sql]
# descricao = gera uma consulta SQL (PostgreSQL)
# entrada = texto
# pedido = Escreva a consulta SQL para este pedido.
# sistema = Responda só com a consulta SQL para PostgreSQL, sem explicações e
#     sem markdown.

# Exemplo: revisar o diff antes do commit.
#
# [revisa]
# descricao = aponta problemas no diff do stage
# entrada = comando
# comando = git diff --staged
# verificar_vazio = nada no stage
# pedido = Revise estas mudanças de código.
# sistema = Você revisa código. Liste em português só problemas reais (bugs,
#     erros de digitação, segredos expostos), em tópicos curtos. Se não houver
#     nada, diga "nada a apontar".
# pensar = sim

# Exemplo: mudar um atalho de fábrica, traduzindo sempre para o espanhol.
#
# [traduz]
# sistema = Traduza o texto para o espanhol. Responda APENAS com a tradução.
